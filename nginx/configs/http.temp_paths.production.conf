# temp dirs must live outside the repo: workers run as another user and their
# 0700 subdirs break tup's scan of the tree. /run/luarocks-site is the
# systemd RuntimeDirectory
client_body_temp_path /run/luarocks-site/client_body_temp;
proxy_temp_path /run/luarocks-site/proxy_temp;
fastcgi_temp_path /run/luarocks-site/fastcgi_temp;
scgi_temp_path /run/luarocks-site/scgi_temp;
uwsgi_temp_path /run/luarocks-site/uwsgi_temp;
