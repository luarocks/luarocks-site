name: "spec"

on: [push]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master

    - name: build
      run: |
        docker build -f Dockerfile.test -t luarocks-test .

    - name: test
      run: |
        # bubblewrap needs to create namespaces, REQUIRE_SANDBOX fails the
        # sandbox specs instead of skipping them when it can't
        docker run --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined -e REQUIRE_SANDBOX=1 luarocks-test
