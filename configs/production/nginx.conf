# Front proxy for luarocks.org. The app itself is OpenResty on 127.0.0.1:8080
# (luarocks-site.service).
user http;
worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	client_max_body_size 15m;
	keepalive_timeout 65;
	server_tokens off;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	# TLS (Let's Encrypt cert for luarocks.org, www, rocks.moonscript.org, mirror)
	ssl_certificate /etc/letsencrypt/live/luarocks.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/luarocks.org/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;
	ssl_session_timeout 1d;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;


	# drop requests for unknown hosts
	server {
		listen 80 default_server;
		listen [::]:80 default_server;
		server_name _;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		location / {
			return 444;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name www.luarocks.org;

		add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		location / {
			return 301 https://luarocks.org$request_uri;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name luarocks.org rocks.moonscript.org;

		add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		location / {
			gzip on;
			gzip_types application/x-javascript text/css;

			proxy_pass http://127.0.0.1:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Original-Scheme $scheme;
			proxy_set_header X-Forwarded-For $remote_addr;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name mirror.luarocks.org;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		root /home/luarocks/backup/moonrocks_root_mirror;

		types {
			text/html html;
			text/x-lua rockspec;
			application/zip rock;
			application/json json;
		}

		gzip on;
		gzip_types text/plain application/json application/x-lua;
		gzip_min_length 1000;

		open_file_cache max=10000 inactive=60s;
		open_file_cache_valid 30s;
		open_file_cache_min_uses 2;
		open_file_cache_errors on;

		location / {
			add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800";
		}

		location /manifest {
			default_type text/x-lua;
			add_header Cache-Control "public, s-maxage=60, stale-while-revalidate=300, stale-if-error=86400";
		}

		# mirror root is a git checkout pushed to GitHub, don't serve the repo metadata
		location ~ /\.git {
			return 404;
		}
	}

	# Grafana (grafana.service on 127.0.0.1:3000), proxied by Cloudflare
	server {
		listen 80;
		listen [::]:80;
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name metrics.luarocks.org;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		location / {
			proxy_pass http://127.0.0.1:3000;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $http_connection;
		}
	}
}
