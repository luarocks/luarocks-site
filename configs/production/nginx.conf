# Front proxy for luarocks.org. The app itself is OpenResty on 127.0.0.1:8080
# (luarocks-site.service). TLS server blocks are added once DNS points here
# and certbot has issued a certificate.
user http;
worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include mime.types;
	default_type application/octet-stream;

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	client_max_body_size 15m;
	keepalive_timeout 65;
	server_tokens off;

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;


	# drop requests for unknown hosts
	server {
		listen 80 default_server;
		listen [::]:80 default_server;
		server_name _;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		location / {
			return 444;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		server_name luarocks.org www.luarocks.org rocks.moonscript.org;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		location / {
			gzip on;
			gzip_types application/x-javascript text/css;

			proxy_pass http://127.0.0.1:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Original-Scheme $scheme;
			proxy_set_header X-Forwarded-For $remote_addr;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		server_name mirror.luarocks.org;

		location /.well-known/acme-challenge/ {
			root /var/lib/letsencrypt/webroot;
		}

		root /home/luarocks/backup/moonrocks_root_mirror;

		types {
			text/html html;
			text/x-lua rockspec;
			application/zip rock;
			application/json json;
		}

		gzip on;
		gzip_types text/plain application/json application/x-lua;
		gzip_min_length 1000;

		open_file_cache max=10000 inactive=60s;
		open_file_cache_valid 30s;
		open_file_cache_min_uses 2;
		open_file_cache_errors on;

		location / {
			add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800";
		}

		location /manifest {
			default_type text/x-lua;
			add_header Cache-Control "public, s-maxage=60, stale-while-revalidate=300, stale-if-error=86400";
		}
	}
}
